name: CI
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run content:check
      - run: npm run check
      - run: npm run build
      - name: Verify SEO essentials in build output
        run: |
          test -f dist/client/robots.txt || (ls dist/client; exit 1)
          test -f dist/client/sitemap-index.xml
          test -f dist/client/llms.txt
          test -f dist/client/og/default.png
          grep -q 'application/ld+json' dist/client/index.html
