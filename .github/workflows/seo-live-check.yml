name: SEO live check
# Fetches the live site the way Googlebot does and prints what it gets: status codes, redirects,
# robots headers, sitemaps. Run it from the Actions tab whenever indexing looks wrong.
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/seo-live-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: DNS
        run: dig +short realai.co.il A; dig +short www.realai.co.il; dig +short realai.co.il TXT
      - name: Fetch as Googlebot
        env:
          UA: 'Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)'
        run: |
          for u in https://realai.co.il/ http://realai.co.il/ https://www.realai.co.il/ \
                   https://realai.co.il/robots.txt https://realai.co.il/sitemap-index.xml \
                   https://realai.co.il/sitemap.xml https://realai.co.il/sitemaps/blog.xml \
                   https://realai.co.il/blog/what-is-claude https://realai.co.il/lectures; do
            echo "=== $u"
            curl -s -o /tmp/body -D - -A "$UA" --max-time 20 "$u" | grep -iE '^(HTTP|location|content-type|x-robots-tag|cf-mitigated|server|cache-control)' || true
            grep -oiE '<meta name="robots"[^>]*>|<link rel="canonical"[^>]*>|<title>[^<]*' /tmp/body | head -3 || true
            head -c 200 /tmp/body | tr '\n' ' '; echo
          done
      - name: Fetch as a normal browser
        run: curl -s -o /dev/null -w 'browser %{http_code} %{url_effective}\n' -L -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/130.0 Safari/537.36' https://realai.co.il/
      - name: AI and search crawlers (status, bytes, blocks)
        run: |
          for ua in 'GPTBot/1.2' 'OAI-SearchBot/1.0' 'ChatGPT-User/1.0' 'ClaudeBot/1.0' 'Claude-SearchBot/1.0' 'Claude-User/1.0' 'PerplexityBot/1.0' 'Perplexity-User/1.0' 'Google-Extended' 'bingbot/2.0' 'Applebot/0.1' 'CCBot/2.0' 'Bytespider' 'meta-externalagent/1.1' 'Amazonbot/0.1'; do
            for u in https://realai.co.il/ https://realai.co.il/blog/what-is-claude https://realai.co.il/llms.txt; do
              curl -s -o /tmp/b -D /tmp/h -A "Mozilla/5.0 (compatible; $ua)" --max-time 20 "$u"
              printf '%-22s %-45s %s bytes=%s mitigated=%s\n' "$ua" "$u" "$(head -1 /tmp/h | tr -d '\r')" "$(wc -c < /tmp/b)" "$(grep -i '^cf-mitigated' /tmp/h | tr -d '\r' || true)"
            done
          done
      - name: robots.txt as served
        run: curl -s https://realai.co.il/robots.txt | head -80
      - name: URL forms (trailing slash, .html, http, www, case, 404)
        run: |
          for u in http://realai.co.il/blog/what-is-claude https://realai.co.il/blog/what-is-claude/ https://realai.co.il/blog/what-is-claude.html https://realai.co.il/blog/ https://realai.co.il/blog https://realai.co.il/Blog https://www.realai.co.il/blog http://www.realai.co.il/ https://realai.co.il/index.html https://realai.co.il/this-page-does-not-exist https://realai.co.il/blog/nope https://realai.co.il/topics/ai-in-education https://realai.co.il/4ef9fbb594cfbcbfcdebc3a32bd23749.txt https://realai.co.il/llms-full.txt https://realai.co.il/rss.xml https://realai.co.il/og/blog-what-is-claude.png https://realai.co.il/blog/ai-lesson-plan/lesson-steps.png; do
            echo "=== $u"
            curl -s -o /tmp/b -D - -A 'Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)' --max-time 20 "$u" | grep -iE '^(HTTP|location|content-type|content-length|content-encoding|cache-control|x-robots-tag|age|cf-cache-status|link|etag|last-modified|strict-transport)' || true
            echo "bytes=$(wc -c < /tmp/b)"
          done
      - name: Compression and timing
        run: |
          for u in https://realai.co.il/ https://realai.co.il/blog https://realai.co.il/blog/what-is-claude https://realai.co.il/academia; do
            curl -s -o /dev/null -H 'accept-encoding: br, gzip' -A 'Mozilla/5.0 Chrome/130' -w "%{url_effective} code=%{http_code} ttfb=%{time_starttransfer}s total=%{time_total}s size=%{size_download}\n" "$u"
            curl -s -o /dev/null -D - -H 'accept-encoding: br, gzip' -A 'Mozilla/5.0 Chrome/130' "$u" | grep -iE '^(content-encoding|cache-control|cf-cache-status)' || true
          done
      - name: Sitemap counts and lastmod
        run: |
          for s in pages topics blog; do
            curl -s https://realai.co.il/sitemaps/$s.xml > /tmp/s.xml
            echo "$s urls=$(grep -o '<loc>' /tmp/s.xml | wc -l) lastmod=$(grep -o '<lastmod>' /tmp/s.xml | wc -l) newest=$(grep -o '<lastmod>[^<]*' /tmp/s.xml | sort | tail -1)"
          done
          curl -s https://realai.co.il/sitemap-index.xml | head -20
      - name: Bing index and IndexNow key
        run: |
          curl -s -o /dev/null -w 'indexnow key %{http_code}\n' https://realai.co.il/4ef9fbb594cfbcbfcdebc3a32bd23749.txt
          curl -s -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130.0 Safari/537.36' 'https://www.bing.com/search?q=site%3Arealai.co.il&count=50' > /tmp/bing.html || true
          echo "bing bytes=$(wc -c < /tmp/bing.html)"
          grep -oE 'class="sb_count"[^<]*<?[^<]*|[0-9,]+ results' /tmp/bing.html | head -3 || true
          grep -oE 'https://realai\.co\.il/[a-z0-9/_-]*' /tmp/bing.html | sort -u | head -60 || true
      - name: Newest pages, homepage H1 and asset caching
        run: |
          curl -s https://realai.co.il/sitemaps/blog.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' | head -6 > /tmp/new.txt
          for u in $(cat /tmp/new.txt) https://realai.co.il/workshops https://realai.co.il/companies; do
            curl -s -o /tmp/b -w "%{http_code} $u " -A 'Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)' "$u"
            echo "related=$(grep -c 'read-next-title' /tmp/b) guides=$(grep -c 'guides-title\|by-team-title' /tmp/b) title=$(grep -o '<title>[^<]*' /tmp/b | head -1)"
          done
          curl -s https://realai.co.il/ > /tmp/home.html
          grep -o '<h1[^>]*>.*</h1>' /tmp/home.html | sed 's/<[^>]*>//g' | head -1
          css=$(grep -o '/_astro/[^"]*\.css' /tmp/home.html | head -1)
          echo "asset $css"; curl -s -o /dev/null -D - "https://realai.co.il$css" | grep -i '^cache-control' || true
          curl -s -o /dev/null -D - https://realai.co.il/blog/ai-lesson-plan/lesson-steps.png | grep -i '^cache-control' || true
          curl -s -o /dev/null -D - https://realai.co.il/blog/ai-lesson-plan | grep -i '^cache-control' || true
